<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="centerGlowMaskable" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8B04B" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#E8B04B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d241c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowMaskable" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Background for Maskable Icon (No Rounded Corners) -->
  <rect width="512" height="512" fill="#0d241c"/>

  <!-- Scaled Web Glyph Inside 60% Safe Zone (Radius = 90) -->
  <!-- Web Outer Hexagonal Connecting Edges -->
  <g stroke="#7FA894" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="4,3">
    <line x1="346" y1="256" x2="301" y2="334" />
    <line x1="301" y1="334" x2="211" y2="334" />
    <line x1="211" y1="334" x2="166" y2="256" />
    <line x1="166" y1="256" x2="211" y2="178" />
    <line x1="211" y1="178" x2="301" y2="178" />
    <line x1="301" y1="178" x2="346" y2="256" />
  </g>

  <!-- Central Spoke Edges to Marrow Node -->
  <g stroke="#E8B04B" stroke-width="2.5" stroke-opacity="0.6">
    <line x1="256" y1="256" x2="346" y2="256" />
    <line x1="256" y1="256" x2="301" y2="334" />
    <line x1="256" y1="256" x2="211" y2="334" />
    <line x1="256" y1="256" x2="166" y2="256" />
    <line x1="256" y1="256" x2="211" y2="178" />
    <line x1="256" y1="256" x2="301" y2="178" />
  </g>

  <!-- Central Marrow Glow -->
  <circle cx="256" cy="256" r="48" fill="url(#centerGlowMaskable)"/>

  <!-- 6 Lichen-Green Nodes -->
  <g fill="#7FA894">
    <!-- Node 1 (East) -->
    <circle cx="346" cy="256" r="13" stroke="#0d241c" stroke-width="2.5"/>
    <circle cx="346" cy="256" r="6" fill="#F5F1E8"/>

    <!-- Node 2 (South-East) -->
    <circle cx="301" cy="334" r="13" stroke="#0d241c" stroke-width="2.5"/>
    <circle cx="301" cy="334" r="6" fill="#F5F1E8"/>

    <!-- Node 3 (South-West) -->
    <circle cx="211" cy="334" r="13" stroke="#0d241c" stroke-width="2.5"/>
    <circle cx="211" cy="334" r="6" fill="#F5F1E8"/>

    <!-- Node 4 (West) -->
    <circle cx="166" cy="256" r="13" stroke="#0d241c" stroke-width="2.5"/>
    <circle cx="166" cy="256" r="6" fill="#F5F1E8"/>

    <!-- Node 5 (North-West) -->
    <circle cx="211" cy="178" r="13" stroke="#0d241c" stroke-width="2.5"/>
    <circle cx="211" cy="178" r="6" fill="#F5F1E8"/>

    <!-- Node 6 (North-East) -->
    <circle cx="301" cy="178" r="13" stroke="#0d241c" stroke-width="2.5"/>
    <circle cx="301" cy="178" r="6" fill="#F5F1E8"/>
  </g>

  <!-- Center Marrow Node (Amber / Gold) -->
  <circle cx="256" cy="256" r="22" fill="#E8B04B" filter="url(#glowMaskable)" stroke="#0d241c" stroke-width="3"/>
  <circle cx="256" cy="256" r="12" fill="#F5F1E8"/>
  <circle cx="256" cy="256" r="5" fill="#E8B04B"/>
</svg>
